function distStr(km){

 if(km<1e12)return fmtNum(km/1e8)+U[1]+unit;
 if(km<1e16)return fmtNum(km/1e12)+U[2]+unit;

let AC=null,master=null,lp=null,drone=null;
function ac(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=20000;master=AC.createGain();master.gain.value=.85;master.connect(lp).connect(AC.destination);}if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(at,f,dur,type,vol,f2){const c=AC;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,at+dur);
 g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol||.3,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g).connect(master);o.start(at);o.stop(at+dur+.02);}
const NB={};function noiseBuf(sec){const k=Math.round(sec*10);if(NB[k])return NB[k];const c=AC,n=c.sampleRate*sec|0,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return NB[k]=b;}
function noise(at,dur,type,f,q,vol,f2){const c=AC;if(!c)return;const s=c.createBufferSource();s.buffer=noiseBuf(dur+.1);const fl=c.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,at);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,at+dur);fl.Q.value=q;const g=c.createGain();
 g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+dur);s.connect(fl).connect(g).connect(master);s.start(at);s.stop(at+dur+.1);}
let lastWarn=0;
const SFX={
 beep(hi){if(!ac())return;tone(AC.currentTime,hi?1320:660,hi?.35:.12,'square',.08);},
 launch(){if(!ac())return;const n=AC.currentTime;noise(n,1.6,'lowpass',300,.7,.6,2400);tone(n,60,1.4,'sawtooth',.18,180);},
 warn(){if(!ac())return;const n=AC.currentTime;if(n-lastWarn<.25)return;lastWarn=n;tone(n,1500,.07,'square',.05);tone(n+.1,1500,.07,'square',.05);},
 pass(big){if(!ac())return;const n=AC.currentTime;(big?[523,659,784,1047,1319]:[659,880,1175]).forEach((f,i)=>tone(n+i*.11,f,.45,'triangle',.16));},
 whoosh(){if(!ac())return;const n=AC.currentTime;noise(n,.35,'bandpass',600,1.5,.18,2400);},
 boom(){if(!ac())return;const n=AC.currentTime;noise(n,2.2,'lowpass',2600,.6,1,60);tone(n,80,1.6,'sine',.9,24);noise(n,.25,'bandpass',3600,1,.5);for(let i=1;i<6;i++)noise(n+i*.13,.4,'lowpass',900,.8,.35/i,120);},
 droneOn(){if(!ac()||drone)return;const c=AC,g=c.createGain();g.gain.value=.0001;g.connect(master);const os=[55,82.4,110.3].map((f,i)=>{const o=c.createOscillator();o.type=i?'sine':'triangle';o.frequency.value=f;o.connect(g);o.start();return o;});g.gain.exponentialRampToValueAtTime(.05,c.currentTime+1.5);drone={g,os};},
 droneOff(){if(!drone)return;const d=drone;drone=null;const n=AC.currentTime;d.g.gain.cancelScheduledValues(n);d.g.gain.setValueAtTime(Math.max(.0001,d.g.gain.value),n);d.g.gain.exponentialRampToValueAtTime(.0001,n+.4);d.os.forEach(o=>o.stop(n+.45));}
};

function fitTo(top,bot){
 const pts=[[-AW-.2,-AH-.2],[AW+.2,-AH-.2],[-AW-.2,AH+.2],[AW+.2,AH+.2]];let lo=6,hi=90;
 for(let i=0;i<30;i++){const d=(lo+hi)/2;placeCam(d,0);cam.updateMatrixWorld();let ok=true;
  for(const [x,z] of pts){const p=new THREE.Vector3(x,0,z).project(cam);if(Math.abs(p.x)>.98||p.y>top||p.y<bot)ok=false;}
  if(ok)hi=d;else lo=d;}
 camD=hi;placeCam(camD,0);
}
function placeCam(d,sh){cam.position.set(TGT.x+(sh?(Math.random()-.5)*sh:0),TGT.y+d*Math.cos(TILT),TGT.z+d*Math.sin(TILT)+(sh?(Math.random()-.5)*sh:0));cam.lookAt(TGT);}

let last=performance.now(),clock=0;
function frame(now){
 const rdt=Math.min(.1,(now-last)/1000);last=now;clock+=rdt;
 if(mode==='video'){requestAnimationFrame(frame);return;}
 let dt=rdt;
 if(mode==='count'){L.countT+=dt;const k=L.countT;
  if(k<3){const n=3-Math.floor(k);if($('big').dataset.n!=String(n)){$('big').dataset.n=n;bigText(String(n),t('ready'));SFX.beep(false);}}
  else if(L.st!=null||k>7.5){$('big').dataset.n='';beginPlay();}else if($('big').dataset.n!=='net'){$('big').dataset.n='net';bigText('…',t('net'));}
 }
 if(mode==='play'){
  L.acc+=dt;let n=0;while(L.acc>=1/TICK&&n<8&&mode==='play'){L.acc-=1/TICK;tickOnce();n++;}if(n>=8)L.acc=0;
  updHud(EB.ms(L.S.tick));
 }
 if(mode==='dead'){dt=rdt*slowK(L.deadT);L.deadT+=dt;if(L.deadT>DEAD_END){mode='result';showResult();}}
 if(mode==='replay')dt=replayFrame(rdt);
 render(dt,rdt);
 requestAnimationFrame(frame);
}
function render(dt,rdt){
 const S=L.S;
 if(S){
  const a=(mode==='play'||mode==='replay')&&!S.dead?Math.min(1,L.acc*TICK):1;
  const sec=(S.tick-1+a)/TICK;
  syncMeteors(S,a,clock);
  syncWorld(Math.max(0,sec),dt);
  const v=mode==='title'?.03:(mode==='count'?.02:EB.base(sec)*TICK*dt*(S.dead?.15:1));scrollStars(mode==='title'?rdt*1.2:v);
  if(mode==='replay'||mode==='play')updHud(EB.ms(S.tick));
  if(earth.visible)poseEarth(L.px+(S.x-L.px)*a,L.pz+(S.z-L.pz)*a,S.moving&&mode!=='title',S.face,dt);
 }
 stepFx(dt);
 shake=Math.max(0,shake-rdt*2);placeCam(camD,shake*.45);
 R.render(S3,cam);
}

function buildRun(seed,D,from){const S=EB.create(seed);for(let i=0;i<from&&i<D.length;i++)EB.step(S,D[i]);return S;}

 const from=Math.max(0,D.length-8*TICK);
 RP={D,seed:EB.seedOf(rec.st),from,i:from,acc:0};L.S=buildRun(RP.seed,D,from);L.px=L.S.x;L.pz=L.S.z;L.passed=EB.passed(L.S.tick/TICK);
}
function replayFrame(rdt){
 const D=RP.D,S=L.S;
 if(L.deadT!=null){const dt=rdt*slowK(L.deadT);L.deadT+=dt;if(L.deadT>DEAD_END+.6){clearFx();L.deadT=null;L.S=buildRun(RP.seed,D,RP.from);RP.i=RP.from;L.px=L.S.x;L.pz=L.S.z;L.passed=EB.passed(L.S.tick/TICK);}return dt;}
 if(RP.i>=D.length&&!S.dead){L.S=buildRun(RP.seed,D,RP.from);RP.i=RP.from;clearFx();return rdt;}
 RP.acc+=rdt;L.acc=RP.acc;while(RP.acc>=1/TICK&&RP.i<D.length){RP.acc-=1/TICK;L.px=S.x;L.pz=S.z;EB.step(S,D[RP.i]);RP.i++;handleEv(S.ev,S);if(S.dead){L.deadT=0;SFX.boom();blowUp(S.x,S.z,S.tick);break;}}
 L.acc=RP.acc;updHud(EB.ms(S.tick));
 return rdt;
}

 const from=Math.max(0,N-6*TICK);
 clearFx();const keep={S:L.S,px:L.px,pz:L.pz,deadT:L.deadT,passed:L.passed};
 let S=buildRun(seed,D,from),i=from,acc=0,dT=null;L.S=S;L.px=S.x;L.pz=S.z;L.passed=EB.passed(S.tick/TICK);L.deadT=null;
 const done=new Promise(res=>{rec.onstop=res;});
 rec.start(200);
 let lastF=performance.now(),endAt=null;
 await new Promise(resolve=>{
  function step(now){
   const rdt=Math.min(.05,(now-lastF)/1000);lastF=now;let dt=rdt;clock+=rdt;
   if(dT==null){acc+=rdt;while(acc>=1/TICK&&i<N){acc-=1/TICK;L.px=S.x;L.pz=S.z;EB.step(S,D[i]);i++;handleEv(S.ev,S);if(S.dead){dT=0;SFX.boom();blowUp(S.x,S.z,S.tick);break;}}}
   else{dt=rdt*slowK(dT);dT+=dt;if(dT>DEAD_END&&endAt==null)endAt=now;}
   L.acc=dT==null?acc:0;
   render(dt,rdt);VR.render(S3,cam);g.drawImage(VR.domElement,0,0,VW,VH);
   g.textAlign='center';g.lineJoin='round';g.lineWidth=8;g.strokeStyle='#000b';const txt=(s,x,y)=>{g.strokeText(s,x,y);g.fillText(s,x,y);};
   g.fillStyle='#fff';g.font='900 30px "Hiragino Maru Gothic ProN",system-ui,sans-serif';txt(t('hud'),VW/2,52);
   g.font='900 46px system-ui,sans-serif';txt(distAt(EB.ms(S.tick)),VW/2,108);
   const bt=$('big').textContent;if(bt&&dT==null){g.fillStyle='#ffd76a';g.font='900 38px "Hiragino Maru Gothic ProN",system-ui,sans-serif';txt(bt,VW/2,VH*.36);}
   if(dT!=null&&dT<SLOW_UNTIL){g.fillStyle='#ffcc00';g.font='900 32px system-ui,sans-serif';txt('SLOW',VW/2,156);}
   if(endAt!=null||(dT!=null&&dT>1.3)){
    g.fillStyle='#ffd76a';g.font='900 60px "Hiragino Maru Gothic ProN",system-ui,sans-serif';txt(distAt(r.ms),VW/2,VH-230);
    g.fillStyle='#fff';g.font='900 30px "Hiragino Maru Gothic ProN",system-ui,sans-serif';txt(t('reach')+'「'+grade(r.ms)+'」',VW/2,VH-172);
   }
   g.fillStyle='#fffc';g.font='700 22px system-ui,sans-serif';txt(GAME_URL.replace('https://',''),VW/2,VH-40);
   if(endAt!=null&&now-endAt>900)resolve();else requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
 });
 rec.stop();await done;
 try{lp.disconnect(dest);}catch(_){}
 VR.dispose();clearFx();$('big').innerHTML='';cam.aspect=oldA;cam.updateProjectionMatrix();camD=oldD;fit();
 Object.assign(L,keep);earth.visible=false;eShadow.visible=false;
 finish(new Blob(chunks,{type:(mime||'video/webm').split(';')[0]}));
 function finish(blob){
  $('recBadge').hidden=true;mode='result';show('vidPanel');vidBlob=blob;
  if(!blob||!blob.size){$('vMsg').textContent=t('vfail');$('vShare').hidden=true;$('vSave').hidden=true;return;}
  const url=URL.createObjectURL(blob);$('vidPrev').src=url;$('vidPrev').play().catch(()=>{});
  const file=new File([blob],'chikyu.'+vidExt,{type:blob.type});
  const canShare=navigator.canShare&&navigator.canShare({files:[file]});
  $('vShare').hidden=!canShare;$('vSave').hidden=false;
  $('vMsg').textContent=canShare?t('vmade'):t('shareHint');
  $('vShare').onclick=async()=>{try{await navigator.share({files:[file],text:postText()+'\n'+GAME_URL});}catch(e){}};
  $('vSave').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='chikyu_'+(r.ms/1000).toFixed(2)+'.'+vidExt;document.body.appendChild(a);a.click();a.remove();};
 }
}

// ===== はじめ =====
fit();applyLang();showTitle();try{R.compile(S3,cam);}catch(e){}requestAnimationFrame(frame);
window.__cb={L,get mode(){return mode},EB,DBG:{},show,grade,distAt,t,set joyDir(v){joyDir=v},startCount,render,blowUp,clearFx,set mode(v){mode=v}};
</script>
