#hudTitle{font-size:12px;font-weight:900;color:#fffb}

.card textarea{resize:none;height:62px}

<body>
<canvas id="c"></canvas>
<div id="pad"></div>

function distStr(ly){

  for(const [v,w] of [[1e15,'quadrillion'],[1e12,'trillion'],[1e9,'billion'],[1e6,'million']])if(ly>=v)return fmtNum(ly/v)+' '+w+' ly';
 }
 const U=lang==='ko'?['만','억','조','경']:lang==='zh'?['萬','億','兆','京']:['万','億','兆','京'];
 const big=(v,unit)=>{if(v<1e4)return fmtNum(v)+unit;if(v<1e8)return fmtNum(v/1e4)+U[0]+unit;if(v<1e12)return fmtNum(v/1e8)+U[1]+unit;if(v<1e16)return fmtNum(v/1e12)+U[2]+unit;return fmtNum(v/1e16)+U[3]+unit;};

  const body={};body['claim/'+pid+'/'+slot]=a.uid;body['inv/'+a.uid+'/b'+row.g]={p:pid,s:String(slot),t:{'.sv':'timestamp'}};
  const r=await PATCH(a,body);if(!r.ok)throw new Error('claim '+r.status);
  if(!prog.inv.includes(row.g))prog.inv.push(row.g);saveProg();c[slot]=a.uid;bbsClaims[pid]=c;SFX.coin();drawBbs();giftOpts();
 }catch(e){console.warn(e);$('bMsg').textContent=t('takeErr');$('bMsg').className='note err';$('bMsg').dataset.k='';loadBbs();}
};

// ===== 宇宙の果ての上位の最後の場面を再生 =====
function buildRun(seed,st,b,w,o,from){const S=EB.create(seed,st,b,w);for(let i=0;i<from&&i<o.D.length;i++)EB.step(S,o.D[i],o.B[i]);return S;}
let RP=null;
function startReplay(rec){
 const o=EB.dec(rec.in);if(!o)return;const D=o.D,w=rec.v===2?EB.AW:rec.w;
 show(null);clearFx();setAW(w);newRun();L.stage=5;L.bid=rec.b;prepStage(5);mode='replay';$('replayBar').hidden=false;$('replayTxt').textContent=t('replaying',{n:rec.n})+'  '+distStr(traveled(5,EB.farU(rec.p)));
 $('hud').hidden=false;$('hudTitle').textContent=t('hud')+'　5. '+stName(5);
 const from=Math.max(0,D.length-8*TICK);
 RP={o,D,w,seed:EB.seedOf(rec.st),from,i:from,acc:0,b:rec.b};L.S=buildRun(RP.seed,5,rec.b,w,o,from);L.px=L.S.x;L.pz=L.S.z;L.passed=EB.passed(5,L.S.u);
}
function replayFrame(rdt){
 const D=RP.D,S=L.S;
 if(L.deadT!=null){const dt=rdt*slowK(L.deadT);L.deadT+=dt;if(L.deadT>DEAD_END+.6){clearFx();L.deadT=null;L.S=buildRun(RP.seed,5,RP.b,RP.w,RP.o,RP.from);RP.i=RP.from;L.px=L.S.x;L.pz=L.S.z;L.passed=EB.passed(5,L.S.u);}return dt;}
 if(RP.i>=D.length&&!S.dead){L.S=buildRun(RP.seed,5,RP.b,RP.w,RP.o,RP.from);RP.i=RP.from;clearFx();return rdt;}
 RP.acc+=rdt;while(RP.acc>=1/TICK&&RP.i<D.length){RP.acc-=1/TICK;L.px=S.x;L.pz=S.z;EB.step(S,D[RP.i],RP.o.B[RP.i]);RP.i++;handleEv(S.ev,S);if(S.dead){L.deadT=0;SFX.boom();blowUp(S.x,S.z,S.tick);break;}}
 L.acc=RP.acc;return rdt;
}
$('replayBack').onclick=()=>{$('replayBar').hidden=true;$('hud').hidden=true;clearFx();mode='title';L.deadT=null;$('big').innerHTML='';openRank(rankFrom);};

// ===== 動画（自分の回を作り直す。最後の数秒 → 木っ端みじんはスロー／クリアはワープ） =====
let vidExt='mp4';
$('vidBtn').onclick=()=>makeVideo();
$('vBack').onclick=()=>show('result');
async function makeVideo(){
 const r=L.res;if(!r||!L.D.length)return;
 const can=document.createElement('canvas');const VW=540,VH=960;can.width=VW;can.height=VH;
 if(!can.captureStream||!window.MediaRecorder){show('vidPanel');$('vMsg').textContent=t('vfail');return;}
 show(null);mode='video';$('recBadge').hidden=false;$('recBadge').textContent='● '+t('making');
 const g=can.getContext('2d');
 const VR=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});VR.setSize(VW,VH,false);VR.setPixelRatio(1);
 const VC=PP&&QL>=2?bloomPasses(VR,VW,VH):null;if(VC)VC.setSize(VW,VH);
 const oldA=cam.aspect;cam.aspect=VW/VH;cam.updateProjectionMatrix();fitTo(.62,-.72);
 ac();const dest=AC.createMediaStreamDestination();lp.connect(dest);
 const stream=can.captureStream(30);dest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
 const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4;codecs=avc3,mp4a.40.2','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
 const mime=types.find(x=>{try{return MediaRecorder.isTypeSupported(x)}catch(e){return false}})||'';
 vidExt=mime.includes('mp4')?'mp4':'webm';
 let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:4e6}:{});}catch(e){finish(null);return;}
 const chunks=[];rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data);};
 const o=EB.dec(EB.enc(L.D,L.BO)),D=o.D,seed=L.seed,N=D.length,st=r.stage,b=r.b,w=L.S.AW;
 const from=Math.max(0,N-6*TICK);
 clearFx();const keep={S:L.S,px:L.px,pz:L.pz,deadT:L.deadT,clearT:L.clearT,passed:L.passed};
 const S=buildRun(seed,st,b,w,o,from);let i=from,acc=0,dT=null,cT=null;L.S=S;L.px=S.x;L.pz=S.z;L.passed=EB.passed(st,S.u);L.deadT=null;L.clearT=null;
 const done=new Promise(res=>{rec.onstop=res;});
 rec.start(200);
 let lastF=performance.now(),endAt=null;
 await new Promise(resolve=>{
  function step(now){
   const rdt=Math.min(.05,(now-lastF)/1000);lastF=now;let dt=rdt;clock+=rdt;
   if(dT==null&&cT==null){acc+=rdt;while(acc>=1/TICK&&i<N){acc-=1/TICK;L.px=S.x;L.pz=S.z;EB.step(S,D[i],o.B[i]);i++;handleEv(S.ev,S);if(S.dead){dT=0;SFX.boom();blowUp(S.x,S.z,S.tick);break;}if(S.clear){cT=0;L.clearT=0;SFX.warp();break;}}}
   else if(dT!=null){dt=rdt*slowK(dT);dT+=dt;if(dT>DEAD_END&&endAt==null)endAt=now;}
   else{cT+=rdt;L.clearT=cT;if(cT>CLEAR_END&&endAt==null)endAt=now;}
   L.acc=dT==null&&cT==null?acc:0;
   render(dt,rdt);if(VC)VC.render();else VR.render(S3,cam);g.drawImage(VR.domElement,0,0,VW,VH);
   g.textAlign='center';g.lineJoin='round';g.lineWidth=8;g.strokeStyle='#000b';const txt=(s,x,y)=>{g.strokeText(s,x,y);g.fillText(s,x,y);};
   g.fillStyle='#fff';g.font='900 26px "Hiragino Maru Gothic ProN",system-ui,sans-serif';txt(t('hud')+'　'+stName(st),VW/2,50);
   g.font='900 44px system-ui,sans-serif';txt(distStr(traveled(st,S.u)),VW/2,104);
   const bt=$('big').textContent;if(bt&&dT==null&&cT==null){g.fillStyle='#ffd76a';g.font='900 34px "Hiragino Maru Gothic ProN",system-ui,sans-serif';txt(bt,VW/2,VH*.36);}
   if(dT!=null&&dT<SLOW_UNTIL){g.fillStyle='#ffcc00';g.font='900 32px system-ui,sans-serif';txt('SLOW',VW/2,150);}
   if(endAt!=null||(dT!=null&&dT>1.3)||(cT!=null&&cT>.8)){
    g.fillStyle='#ffd76a';g.font='900 46px "Hiragino Maru Gothic ProN",system-ui,sans-serif';
    txt(cT!=null?stName(st)+' '+t('clearBig'):distStr(traveled(st,r.u)),VW/2,VH-230);
    g.fillStyle='#fff';g.font='900 28px "Hiragino Maru Gothic ProN",system-ui,sans-serif';
    txt(cT!=null?(r.ms/1000).toFixed(2)+t('sec')+'・'+bName(b):t('reach')+'「'+resPlace(r)+'」',VW/2,VH-174);
   }
   g.fillStyle='#fffc';g.font='700 22px system-ui,sans-serif';txt(GAME_URL.replace('https://',''),VW/2,VH-40);
   if(endAt!=null&&now-endAt>900)resolve();else requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
 });
 rec.stop();await done;
 try{lp.disconnect(dest);}catch(_){}
 if(VC&&VC.dispose)VC.dispose();VR.dispose();clearFx();$('big').innerHTML='';cam.aspect=oldA;cam.updateProjectionMatrix();fit();
 Object.assign(L,keep);earth.visible=r.kind==='clear';eShadow.visible=earth.visible;
 finish(new Blob(chunks,{type:(mime||'video/webm').split(';')[0]}));
 function finish(blob){
  $('recBadge').hidden=true;mode='result';show('vidPanel');
  if(!blob||!blob.size){$('vMsg').textContent=t('vfail');$('vShare').hidden=true;$('vSave').hidden=true;return;}
  const url=URL.createObjectURL(blob);$('vidPrev').src=url;$('vidPrev').play().catch(()=>{});
  const file=new File([blob],'chikyu.'+vidExt,{type:blob.type});
  const canShare=navigator.canShare&&navigator.canShare({files:[file]});
  $('vShare').hidden=!canShare;$('vSave').hidden=false;
  $('vMsg').textContent=canShare?t('vmade'):t('shareHint');
  $('vShare').onclick=async()=>{try{await navigator.share(nqS({files:[file],text:postText()+'\n'+GAME_URL}));}catch(e){}};
  $('vSave').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='chikyu_'+st+'_'+(r.ms/1000).toFixed(2)+'.'+vidExt;document.body.appendChild(a);a.click();a.remove();};
 }
}

// ===== 宣伝動画を撮るための道具（遊びには使わない） =====
const PV={};
function pvInit(c){
 show(null);clearFx();setAW(c.w||EB.AW);newRun();L.stage=c.stage;L.bid=c.bid;prepStage(c.stage);
 const S=EB.create(c.seed||1,c.stage,c.bid,c.w||EB.AW);S.u=c.u0||0;S.tick=c.tick0||0;S.next=S.tick+20;
 L.S=S;L.px=S.x;L.pz=S.z;L.passed=EB.passed(c.stage,S.u);L.deadT=null;L.clearT=null;
 Object.assign(PV,{acc:0,c,ev:[]});mode='pv';$('big').innerHTML='';$('hud').hidden=!!c.noHud;$('boostBtn').hidden=!!c.noHud;
 $('hudTitle').textContent=t('hud')+'　'+c.stage+'. '+stName(c.stage);updHud(S);
}
// かんたんな自動操縦：ぶつからない向きをえらぶ（seek：ブースト中は隕石に向かう）
function pvBot(S,seek){let best=0,bs=-1e9;for(let d=0;d<=32;d+=(d?2:1)){const v=d?DIR[d-1]:[0,0];const x=S.x+v[0]*1.3,z=S.z+v[1]*1.3;let mn=9;
 for(const m of S.ms){if(S.tick<m.ti)continue;for(let k=0;k<36;k+=6){const dd=Math.hypot(x*k/36+S.x*(1-k/36)-m.x-m.vx*k,z*k/36+S.z*(1-k/36)-m.z-m.vz*k)-m.r-.5;if(dd<mn)mn=dd;}}
 const sc=(seek?-Math.min(mn,3)*4:Math.min(mn,1)*10)-Math.abs(x)*.05-Math.abs(z-2.4)*.1;if(sc>bs){bs=sc;best=d;}}return best;}
function pvFrame(dt,ctl){
 ctl=ctl||{};const S=L.S,ev=[];let d2=dt;
 if(L.deadT!=null){d2=dt*slowK(L.deadT);L.deadT+=d2;}
 else if(L.clearT!=null){L.clearT+=dt;}
 else{PV.acc+=dt;while(PV.acc>=1/TICK){PV.acc-=1/TICK;L.px=S.x;L.pz=S.z;
  if(S.tick%3===0)PV.dir=ctl.dir!=null?ctl.dir:pvBot(S,(ctl.seek&&S.bt>0)||ctl.hunt);
  const bo=ctl.boost&&S.boosts>0&&S.bt<=0?1:0;ctl.boost=false;
  const p0=L.passed;EB.step(S,PV.dir||0,bo);handleEv(S.ev,S);
  for(const x of S.ev){if(x.e==='smash')ev.push('smash');if(x.e==='boost')ev.push('boost');if(x.e==='warn'&&x.m.ti>x.m.t0)ev.push('warn');}
  if(L.passed>p0)ev.push(MARKS[S.stage][L.passed-1][0]==='helio'?'escape':'pass');
  if(S.dead){if(ctl.die){L.deadT=0;SFX.boom();blowUp(S.x,S.z,S.tick);ev.push('dead');break;}S.dead=false;if(S.by)S.by.gone=true;S.ms=S.ms.filter(m=>!m.gone);}
  if(S.clear){L.clearT=0;flashScreen(true);ev.push('warp');break;}}}
 const a=L.deadT==null&&L.clearT==null?Math.min(1,PV.acc*TICK):1;
 L.acc=a/TICK;updHud(S);
 const m0=mode;mode='replay';render(d2,dt);mode=m0;
 return {ev,u:S.u,tick:S.tick,boosts:S.boosts,dead:S.dead,clear:S.clear};
}

fit();applyLang();showTitle();try{R.compile(S3,cam);}catch(e){}requestAnimationFrame(frame);

 setStage(s){curStage=s;ls.set('cb_stage',s);drawPick();titleScene();},pick(b){pick[curStage]=b;ls.set('cb_pick',pick);drawPick();}};
